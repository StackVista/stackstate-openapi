# OpenApi header is included in this file to support code highlighting in VSCode
openapi: 3.0.3
info:
  title: Silencing Rules API
  version: "1.0.0"
paths:
  /silencing-rules:
    get:
      tags:
        - silencing-rule
      summary: "List silencing rules"
      description: "List all active silencing rules"
      operationId: getAllSilencingRules
      responses:
        "200":
          $ref: "#/components/responses/silencingRules"
        "500":
          $ref: "#/components/responses/silencingRuleApiError"
    post:
      tags:
        - silencing-rule
      summary: "Create a silencing rule"
      description: "Create a new silencing rule. Only one silencing rule may be active per monitor check state."
      operationId: createSilencingRule
      requestBody:
        $ref: "#/components/requestBodies/createSilencingRule"
      responses:
        "200":
          $ref: "#/components/responses/silencingRule"
        "400":
          $ref: "#/components/responses/silencingRuleApiError"
        "409":
          $ref: "#/components/responses/silencingRuleConflictError"
        "500":
          $ref: "#/components/responses/silencingRuleApiError"

  /silencing-rules/{identifier}:
    delete:
      tags:
        - silencing-rule
      summary: "Delete a silencing rule"
      description: "Remove a silencing rule by its identifier."
      operationId: deleteSilencingRule
      parameters:
        - $ref: "#/components/parameters/identifier"
      responses:
        "204":
          description: "Silencing rule removed"
        "400":
          $ref: "#/components/responses/silencingRuleApiError"
        "404":
          $ref: "#/components/responses/silencingRuleNotFoundError"
        "500":
          $ref: "#/components/responses/silencingRuleApiError"

components:
  parameters:
    identifier:
      in: path
      name: identifier
      required: true
      schema:
        type: string
      description: "The unique identifier (URN) of the silencing rule"

  requestBodies:
    createSilencingRule:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateSilencingRule"

  responses:
    silencingRule:
      description: "A silencing rule"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SilencingRule"
    silencingRules:
      description: "List of silencing rules"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SilencingRuleList"
    silencingRuleApiError:
      description: "Error response"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SilencingRuleApiError"
    silencingRuleNotFoundError:
      description: "Silencing rule not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SilencingRuleNotFoundError"
    silencingRuleConflictError:
      description: "A silencing rule already exists for the given monitor check state"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SilencingRuleConflictError"

  schemas:
    CreateSilencingRule:
      type: object
      description: "Request body for creating a silencing rule"
      properties:
        startTimeEpochMs:
          type: integer
          format: int64
        endTimeEpochMs:
          type: integer
          format: int64
        note:
          type: string
          description: "Human-readable reason for the silencing rule."
        selector:
          $ref: "#/components/schemas/SilencingRuleSelector"
      required:
        - note
        - selector

    SilencingRule:
      type: object
      description: "A silencing rule as returned by the API"
      properties:
        identifier:
          type: string
          description: "Unique URN for this silencing rule."
        note:
          type: string
        startTimeEpochMs:
          type: integer
          format: int64
        endTimeEpochMs:
          type: integer
          format: int64
        selector:
          $ref: "#/components/schemas/SilencingRuleSelector"
      required:
        - identifier
        - note
        - selector
        - startTimeEpochMs
        - endTimeEpochMs

    SilencingRuleSelector:
      type: object
      description: "Selects what to silence. Discriminated by `_type` to allow future selector variants."
      properties:
        _type:
          type: string
      oneOf:
        - $ref: "#/components/schemas/MonitorCheckStateSelector"
      discriminator:
        propertyName: _type
      required:
        - _type

    MonitorCheckStateSelector:
      type: object
      description: "Selects a single monitor check state, identified by its already-resolved SyncedCheckState identifier."
      properties:
        _type:
          type: string
          enum: [MonitorCheckStateSelector]
        checkStateIdentifier:
          type: string
          description: "The FullCheckStateId string identifying the targeted check state (see SyncedCheckState.identifier)."
      required:
        - _type
        - checkStateIdentifier

    SilencingRuleList:
      type: object
      properties:
        silencingRules:
          type: array
          items:
            $ref: "#/components/schemas/SilencingRule"
      required:
        - silencingRules

    SilencingRuleApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    SilencingRuleNotFoundError:
      type: object
      properties:
        identifier:
          type: string
        _type:
          type: string
          enum:
            - SilencingRuleNotFoundError
      required:
        - identifier
        - _type

    SilencingRuleConflictError:
      type: object
      properties:
        message:
          type: string
        existingIdentifier:
          type: string
          description: "The identifier of the already-active silencing rule."
      required:
        - message
        - existingIdentifier
