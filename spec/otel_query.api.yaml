# OpenApi header is included in this file to support code highlighting in VSCode
openapi: 3.0.3
info:
  title: Telemetry Query API
  version: "1.0.0"
paths:
  /logs/query:
    post:
      x-stability: internal
      tags:
        - otelQuery
      requestBody:
        $ref: "#/components/requestBodies/otelQuery"
      summary: Query logs
      description: Evaluates a telemetry query language query over logs. Records and tables read one input interval; series read at one evaluation time. Returned logs are restricted by the caller's `get-logs` scope. Queries accessing related spans also apply the caller's `get-traces` scope.
      operationId: queryLogs
      responses:
        "200":
          $ref: "#/components/responses/otelQueryResponse"
        "400":
          $ref: "#/components/responses/otelQueryBadRequest"
        "422":
          $ref: "#/components/responses/otelQueryWithheld"
        "500":
          $ref: "#/components/responses/otelQueryError"

  /logs/query_range:
    post:
      x-stability: internal
      tags:
        - otelQuery
      requestBody:
        $ref: "#/components/requestBodies/otelQuery"
      summary: Query log series over a range
      description: Evaluates a series query on a grid. Each sample reads its full lookback window; the caller's `get-logs` scope applies to every sample and group. Records and table queries are rejected.
      operationId: queryLogsRange
      responses:
        "200":
          $ref: "#/components/responses/otelQueryResponse"
        "400":
          $ref: "#/components/responses/otelQueryBadRequest"
        "422":
          $ref: "#/components/responses/otelQueryWithheld"
        "500":
          $ref: "#/components/responses/otelQueryError"

components:
  requestBodies:
    otelQuery:
      description: The query and how to evaluate it
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OtelQueryRequest" }

  responses:
    otelQueryResponse:
      description: The query result, with diagnostics and the cost of evaluating it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OtelQueryResponse" }
          examples:
            linkedSpan:
              summary: One authorized span; duration is 2000000 nanoseconds.
              value: {"result":{"_type":"OtelQueryRecords","columns":[{"name":"body","valueType":"string"},{"name":"linked_span","valueType":"structured"}],"rows":[[{"_type":"OtelTextValue","value":"checkout failed"},{"_type":"OtelStructuredValue","json":"{\"kvlistValue\":{\"values\":[{\"key\":\"records\",\"value\":{\"arrayValue\":{\"values\":[{\"kvlistValue\":{\"values\":[{\"key\":\"span.trace_id\",\"value\":{\"stringValue\":\"00000000000000000000000000000001\"}},{\"key\":\"span.span_id\",\"value\":{\"stringValue\":\"0000000000000002\"}},{\"key\":\"span.start_time\",\"value\":{\"stringValue\":\"2026-11-19T10:00:00Z\"}},{\"key\":\"span.name\",\"value\":{\"stringValue\":\"checkout\"}},{\"key\":\"span.kind\",\"value\":{\"stringValue\":\"server\"}},{\"key\":\"span.status\",\"value\":{\"stringValue\":\"error\"}},{\"key\":\"span.duration\",\"value\":{\"stringValue\":\"2000000\"}}]}}]}}},{\"key\":\"truncated\",\"value\":{\"boolValue\":false}}]}}"}]]},"diagnostics":[],"cost":{"readRows":2,"readBytes":512,"elapsedNanos":1000000},"linkedSpanResolution":"resolved"}
    otelQueryBadRequest:
      description: The request or the query is invalid, unsupported, or exceeds the request budget
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OtelQueryBadRequest" }
    otelQueryWithheld:
      description: The stored data cannot answer the query reliably, so no values are returned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OtelQueryWithheld" }
    otelQueryError:
      description: Server error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OtelQueryError" }

  schemas:
    OtelQueryRequest:
      type: object
      description: A query and how to evaluate it. The signal is the endpoint's, never part of the request.
      properties:
        query:
          type: string
          description: The query text.
        languageVersion:
          type: string
          description: The query language version the text is written in.
          example: "1"
        input: { $ref: "#/components/schemas/OtelQueryInput" }
        options: { $ref: "#/components/schemas/OtelQueryOptions" }
      required:
        - query
        - languageVersion
        - input

    OtelQueryInput:
      description: An input interval for records and tables, or an evaluation time or range for series.
      oneOf:
        - $ref: "#/components/schemas/OtelQueryInterval"
        - $ref: "#/components/schemas/OtelQueryEvaluationTime"
        - $ref: "#/components/schemas/OtelQueryRange"
      discriminator:
        propertyName: _type
      required:
        - _type

    OtelQueryInterval:
      type: object
      description: Records whose time is at or after `start` and before `end`.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryInterval
        start: { $ref: "common.api.yaml#/components/schemas/Instant" }
        end: { $ref: "common.api.yaml#/components/schemas/Instant" }
      required:
        - _type
        - start
        - end

    OtelQueryEvaluationTime:
      type: object
      description: One series evaluation at `at`; each window ends at `at`.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryEvaluationTime
        at: { $ref: "common.api.yaml#/components/schemas/Instant" }
      required:
        - _type
        - at

    OtelQueryRange:
      type: object
      description: A series grid on /logs/query_range. Explicit windows evaluate first at start; omitted windows equal step and evaluate first at start plus step. Only full steps are returned.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryRange
        start: { $ref: "common.api.yaml#/components/schemas/Instant" }
        end: { $ref: "common.api.yaml#/components/schemas/Instant" }
        stepNanos:
          type: string
          pattern: '^[1-9][0-9]*$'
          example: '300000000000'
          description: Positive Int64 decimal string giving the distance between evaluations in nanoseconds; independent of an explicit query lookback window.
      required:
        - _type
        - start
        - end
        - stepNanos

    OtelQueryOptions:
      type: object
      properties:
        typeMismatchCounts:
          type: boolean
          default: false
          description: Adds counts of values with incompatible types for each comparison. For example, comparing `latency_ms > 100` counts string values such as `"150"` as type mismatches. Results are unchanged; the additional reads count toward the request budget.

        resolveLinkedSpans:
          type: boolean
          default: false
          description: Adds a structured linked_span column to log Records, using exact trace and span IDs from returned rows. Reads apply the caller's get-traces scope and retained span storage, independently of the log interval. The server byte limit counts the UTF-8 JSON bytes added by structured API values, column metadata, and array separators, including JSON string escaping; existing log values and the response envelope are excluded. Time limits reserve time to return completed logs; cancellation cleanup can finish in the background. Limits do not change log selection. Explicit related_span predicates still enforce their own limits and errors.

    OtelQueryResponse:
      type: object
      properties:
        result: { $ref: "#/components/schemas/OtelQueryResult" }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/OtelQueryDiagnostic" }
        cost: { $ref: "#/components/schemas/OtelQueryCost" }
        linkedSpanResolution:
          $ref: "#/components/schemas/OtelLinkedSpanResolution"
      required:
        - result
        - diagnostics
        - cost

    OtelLinkedSpanResolution:
      type: string
      enum: [resolved, limit_exceeded]
      description: Present when resolveLinkedSpans is requested. resolved means the authorized linked-span read completed; missing spans produce empty records. limit_exceeded preserves logs and reports incomplete or omitted span output. The linked_span cell uses OTLP AnyValue JSON inside OtelStructuredValue.json, with records and truncated fields. Span fields are span.trace_id and span.span_id (lowercase hexadecimal), span.start_time (ISO 8601 UTC), span.name, span.kind, span.status, and span.duration (decimal nanoseconds). Output is limited to one span per log; duplicate versions use deterministic ordering. Storage failures remain errors.

    OtelQueryResult:
      oneOf:
        - $ref: "#/components/schemas/OtelQueryRecords"
        - $ref: "#/components/schemas/OtelQueryTable"
        - $ref: "#/components/schemas/OtelQuerySeriesFrame"
      discriminator:
        propertyName: _type
      required:
        - _type

    OtelQuerySeriesFrame:
      type: object
      description: One series per group and selected measure. Every retained series has a sample at each evaluation, including empty windows.
      properties:
        _type:
          type: string
          enum:
            - OtelQuerySeriesFrame
        series:
          type: array
          items: { $ref: "#/components/schemas/OtelQuerySeries" }
      required:
        - _type
        - series

    OtelQuerySeries:
      type: object
      properties:
        measure:
          type: string
        valueType: { $ref: "#/components/schemas/OtelValueType" }
        unit:
          type: string
          description: Declared unit of the numeric values. Values retain this unit without implicit rescaling.
          enum:
            - ns
            - us
            - ms
            - s
            - B
            - B/s
            - records
            - records/s
        labels:
          type: array
          items: { $ref: "#/components/schemas/OtelQuerySeriesLabel" }
        samples:
          type: array
          items: { $ref: "#/components/schemas/OtelQuerySample" }
      required:
        - measure
        - valueType
        - labels
        - samples

    OtelQuerySeriesLabel:
      type: object
      description: Label names use public dotted field names, such as resource.identity or resource.attributes.service.name. Explicit query aliases retain their names.
      properties:
        name:
          type: string
        value: { $ref: "#/components/schemas/OtelValue" }
      required:
        - name
        - value

    OtelQuerySample:
      type: object
      description: A value at an evaluation timestamp. Empty values preserve gaps; counts and rates are zero for an empty window.
      properties:
        at: { $ref: "common.api.yaml#/components/schemas/InstantNanoPrecision" }
        value: { $ref: "#/components/schemas/OtelValue" }
      required:
        - at
        - value

    OtelQueryRecords:
      type: object
      description: One row per selected record.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryRecords
        columns:
          type: array
          items: { $ref: "#/components/schemas/OtelQueryColumn" }
        rows:
          type: array
          description: Each row has one value per column, in column order.
          items:
            type: array
            items: { $ref: "#/components/schemas/OtelValue" }
      required:
        - _type
        - columns
        - rows

    OtelQueryTable:
      type: object
      description: One row per aggregate group.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryTable
        columns:
          type: array
          items: { $ref: "#/components/schemas/OtelQueryColumn" }
        rows:
          type: array
          description: Each row has one value per column, in column order.
          items:
            type: array
            items: { $ref: "#/components/schemas/OtelValue" }
      required:
        - _type
        - columns
        - rows

    OtelQueryColumn:
      type: object
      properties:
        name:
          type: string
        valueType: { $ref: "#/components/schemas/OtelValueType" }
        unit:
          type: string
          description: Declared unit of the numeric values. Values retain this unit without implicit rescaling.
          enum:
            - ns
            - us
            - ms
            - s
            - B
            - B/s
            - records
            - records/s
      required:
        - name
        - valueType

    OtelValueType:
      type: string
      description: The type of a column's values. A `dynamic` column, such as an attribute, holds values of varying types, each carrying its own.
      enum:
        - int64
        - float64
        - bool
        - string
        - bytes
        - timestamp
        - duration
        - histogram
        - structured
        - dynamic

    OtelValue:
      description: One result value. Every value is tagged with its type, so a column of type `dynamic` needs no further metadata.
      oneOf:
        - $ref: "#/components/schemas/OtelEmptyValue"
        - $ref: "#/components/schemas/OtelInt64Value"
        - $ref: "#/components/schemas/OtelFloat64Value"
        - $ref: "#/components/schemas/OtelNonFiniteFloat64Value"
        - $ref: "#/components/schemas/OtelBoolValue"
        - $ref: "#/components/schemas/OtelTextValue"
        - $ref: "#/components/schemas/OtelBytesValue"
        - $ref: "#/components/schemas/OtelTimestampValue"
        - $ref: "#/components/schemas/OtelDurationValue"
        - $ref: "#/components/schemas/OtelHistogramValue"
        - $ref: "#/components/schemas/OtelStructuredValue"
      discriminator:
        propertyName: _type
      required:
        - _type

    OtelEmptyValue:
      type: object
      description: A missing or null-like value.
      properties:
        _type:
          type: string
          enum:
            - OtelEmptyValue
      required:
        - _type

    OtelInt64Value:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelInt64Value
        value:
          type: string
          description: A 64-bit integer in decimal. A string because JavaScript numbers are exact only up to 2^53.
          pattern: "^-?[0-9]+$"
          example: "9007199254740993"
      required:
        - _type
        - value

    OtelFloat64Value:
      type: object
      description: A finite double. Negative zero is normalized to zero in API responses.
      properties:
        _type:
          type: string
          enum:
            - OtelFloat64Value
        value:
          type: number
          format: double
      required:
        - _type
        - value

    OtelNonFiniteFloat64Value:
      type: object
      description: A double that JSON numbers cannot represent.
      properties:
        _type:
          type: string
          enum:
            - OtelNonFiniteFloat64Value
        value:
          type: string
          enum:
            - NaN
            - Infinity
            - -Infinity
      required:
        - _type
        - value

    OtelBoolValue:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelBoolValue
        value:
          type: boolean
      required:
        - _type
        - value

    OtelTextValue:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelTextValue
        value:
          type: string
      required:
        - _type
        - value

    OtelBytesValue:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelBytesValue
        value:
          type: string
          description: Base64-encoded bytes.
      required:
        - _type
        - value

    OtelTimestampValue:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelTimestampValue
        value: { $ref: "common.api.yaml#/components/schemas/InstantNanoPrecision" }
      required:
        - _type
        - value

    OtelDurationValue:
      type: object
      properties:
        _type:
          type: string
          enum:
            - OtelDurationValue
        nanos:
          type: string
          description: The duration in nanoseconds, in decimal; a string for the same reason as `OtelInt64Value`.
          pattern: "^-?[0-9]+([.][0-9]+)?$"
      required:
        - _type
        - nanos

    OtelHistogramValue:
      type: object
      description: A duration distribution over authorized primary records. Bucket counts are exact; bounds are lower-inclusive and upper-exclusive.
      properties:
        _type:
          type: string
          enum:
            - OtelHistogramValue
        unit:
          type: string
          enum:
            - ns
            - us
            - ms
            - s
        totalValidCount:
          type: string
          pattern: "^[0-9]+$"
          description: The sum of all bucket counts, as a decimal integer.
        buckets:
          type: array
          minItems: 3
          maxItems: 512
          items: { $ref: "#/components/schemas/OtelHistogramBucket" }
      required:
        - _type
        - unit
        - totalValidCount
        - buckets

    OtelHistogramBucket:
      type: object
      properties:
        lower:
          type: string
          pattern: "^-?[0-9]+([.][0-9]+)?$"
          description: Inclusive bound in the histogram unit. Absent for the underflow bucket.
        upper:
          type: string
          pattern: "^-?[0-9]+([.][0-9]+)?$"
          description: Exclusive bound in the histogram unit. Absent for the overflow bucket.
        count:
          type: string
          pattern: "^[0-9]+$"
          description: Exact observation count, as a decimal integer.
      required:
        - count

    OtelStructuredValue:
      type: object
      description: An array, key-value list or bytes value, kept in its original OpenTelemetry type.
      properties:
        _type:
          type: string
          enum:
            - OtelStructuredValue
        json:
          type: string
          description: The value as OTLP JSON AnyValue, for example `{"arrayValue":{"values":[{"intValue":"1"}]}}`.
      required:
        - _type
        - json

    OtelQueryDiagnostic:
      type: object
      properties:
        category:
          type: string
          description: Where the diagnostic comes from, for example `syntax`, `validation`, `capability`, `budget`, `guard`, `value` or `result`.
        code:
          type: string
          description: A stable identifier for the diagnostic, for example `TYPE_MISMATCH` or `TRUNCATED`.
        message:
          type: string
        location: { $ref: "#/components/schemas/OtelQuerySourceLocation" }
      required:
        - category
        - code
        - message

    OtelQuerySourceLocation:
      type: object
      description: The part of the query text a diagnostic is about, as 0-based UTF-16 code unit offsets with an exclusive end, the units JavaScript string indexes use. Diagnostics about the data or the request, such as budget, guard and result diagnostics, have no location.
      properties:
        start:
          type: integer
          format: int32
          minimum: 0
        end:
          type: integer
          format: int32
          minimum: 0
      required:
        - start
        - end

    OtelQueryCost:
      type: object
      description: Known costs summed over completed statements. Failed or cancelled optional linked-span reads are excluded, so limit_exceeded can report incomplete cost accounting. elapsedNanos is the sum of completed statement durations, not the request duration.
      properties:
        readRows:
          type: integer
          format: int64
        readBytes:
          type: integer
          format: int64
        elapsedNanos:
          type: integer
          format: int64
      required:
        - readRows
        - readBytes
        - elapsedNanos

    OtelQueryBadRequest:
      oneOf:
        - $ref: "#/components/schemas/OtelQueryInvalidRequest"
        - $ref: "#/components/schemas/OtelQueryInvalidQuery"
        - $ref: "#/components/schemas/OtelQueryIncompatibleInput"
        - $ref: "#/components/schemas/OtelQueryUnsupported"
        - $ref: "#/components/schemas/OtelQueryBudgetExceeded"
      discriminator:
        propertyName: _type
      required:
        - _type

    OtelQueryInvalidRequest:
      type: object
      description: The request parameters, not the query text, are invalid.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryInvalidRequest
        message:
          type: string
      required:
        - _type
        - message

    OtelQueryInvalidQuery:
      type: object
      description: The query text is not valid in the requested language version.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryInvalidQuery
        diagnostic: { $ref: "#/components/schemas/OtelQueryDiagnostic" }
      required:
        - _type
        - diagnostic

    OtelQueryIncompatibleInput:
      type: object
      description: The query's result shape needs another input, for example an interval where an evaluation time was given.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryIncompatibleInput
        message:
          type: string
      required:
        - _type
        - message

    OtelQueryUnsupported:
      type: object
      description: The query is valid, but this server cannot evaluate it yet.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryUnsupported
        diagnostic: { $ref: "#/components/schemas/OtelQueryDiagnostic" }
      required:
        - _type
        - diagnostic

    OtelQueryBudgetExceeded:
      type: object
      description: The query exceeds a request limit, such as data read, result size, execution time, input window, statement count or grouping fields.
      properties:
        _type:
          type: string
          enum:
            - OtelQueryBudgetExceeded
        message:
          type: string
      required:
        - _type
        - message

    OtelQueryWithheld:
      type: object
      description: A correctness check on the stored data failed, so no values are returned. Not a fault in the query; for example, resource metadata is missing for some records.
      properties:
        diagnostic: { $ref: "#/components/schemas/OtelQueryDiagnostic" }
      required:
        - diagnostic

    OtelQueryError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
