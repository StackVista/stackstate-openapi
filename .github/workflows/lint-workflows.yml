name: Workflow Security Audit

# zizmor security audit of .github/workflows/.

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/**"
      - "zizmor.yml"
  push:
    branches: [master]
    paths:
      - ".github/**"
      - "zizmor.yml"

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.ZIZMOR_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ZIZMOR_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "renovate-config"
          permission-contents: read

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor security audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pip install zizmor
          zizmor .
