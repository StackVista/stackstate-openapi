# OpenApi header is included in this file to support code highlighting in VSCode
openapi: 3.0.3
info:
  title: Structures common to settings and api
  description: "Stability is declared per schema with `x-stability`; schemas not marked `stable` are internal and can change without notice."
  version: "1.0.0"

components:
  schemas:
    ComponentPresentationQueryBinding:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        query:
          type: string
          description: 'Stq query that defines to which components does the presentation applies to.'
      required:
        - query

    ComponentPresentationRank:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        specificity:
          type: number
          format: double
          description: 'Determines how much of a "specialization" this presentation is. Higher number means more specific. This is used to determine which presentation to use when multiple presentations match.'
      required:
        - specificity

    ComponentPresentationMetrics:
      x-stability: internal
      type: array
      items:
        $ref: "#/components/schemas/ComponentPresentationMetric"

    PresentationDefinition:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        icon:
          type: string
        overview:
          $ref: "#/components/schemas/PresentationOverview"
        highlight:
          $ref: "#/components/schemas/PresentationHighlight"
        summary:
          $ref: "#/components/schemas/PresentationSummary"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ComponentPresentationFilter"
        metricPerspective:
          $ref: "#/components/schemas/PresentationMetricPerspective"
        tracesPerspective:
          $ref: "#/components/schemas/PresentationTracesPerspective"
        topology:
          $ref: "#/components/schemas/TopologySettings"
      description: |
        Component presentation definition.
        If multiple ComponentPresentations match, `filters` are merged by filter identity with the most specific presentation winning.
        Scalar fields like `icon` and `topology` follow most-specific-wins semantics across matching presentations.
        Absence of `topology` means the Topology perspective is not available for this presentation.
        Absence of the field keeps legacy behavior (for example, ViewType-based filters) unchanged.

    PresentationName:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        singular:
          type: string
        plural:
          type: string
        title:
          type: string
      required:
        - singular
        - plural
        - title

    FilterName:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        singular:
          type: string
        plural:
          type: string
      required:
        - singular
        - plural

    PresentationOverviewSorting:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        columnId:
          type: string
        direction:
          $ref: '#/components/schemas/PresentationOverviewSortingDirection'
      required:
        - columnId
    PresentationOverviewSortingDirection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: string
      enum:
        - Ascending
        - Descending
    PresentationOverview:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        name:
          $ref: "#/components/schemas/PresentationName"
        mainMenu:
          $ref: "#/components/schemas/PresentationMainMenu"
        columns:
          type: array
          items:
            $ref: '#/components/schemas/OverviewColumnDefinition'
        fixedColumns:
          type: integer
        sort:
          type: array
          items:
            $ref: '#/components/schemas/PresentationOverviewSorting'
      description: |
        Overview presentation definition. The `columns` field defines the columns to show in the overview table. The `flags` field can be used to enable/disable functionalities.
        If multiple ComponentPresentations match, columns are merged by `columnId` according to binding rank. Absence of the field means no overview is shown.
      required:
        - columns
        - name

    PresentationMainMenu:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        group:
          type: string
        icon:
          type: string
        order:
          type: number
          format: double
      required:
        - group
        - order

    OverviewColumnDefinition:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        columnId:
          type: string
        title:
          type: string
        projection:
          $ref: "#/components/schemas/ComponentOverviewProjection"
      required:
        - columnId
      description: 'Definition of a column in the overview presentation. The `columnId` field is used to identify the column and merge columns from different presentations. If only the `columnId` is provided, the column will be rendered from the next more specific presentation definition.'

    PresentationHighlight:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PresentationHighlightField'
        provisioning:
          $ref: '#/components/schemas/PresentationHighlightProvisioning'
        relatedResources:
          type: array
          items:
            $ref: '#/components/schemas/PresentationRelatedResource'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PresentationLink'
        events:
          $ref: '#/components/schemas/PresentationHighlightEvents'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/PresentationHighlightMetricsSection'
      description: |
        Highlight presentation definition. The `fields` define the fields to show in the highlight page.
        If multiple ComponentPresentations match, fields are merged by `fieldId` according to binding rank.
        Related resources follow the same merge semantics using `resourceId` as the identity key.
        Links follow the same merge semantics using `linkId` as the identity key.

    PresentationHighlightField:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        fieldId:
          type: string
        title:
          type: string
        description:
          type: string
        order:
          type: number
          format: double
        projection:
          $ref: "#/components/schemas/ComponentHighlightProjection"
      required:
        - fieldId
        - title
        - order
      description: 'Definition of a field in the highlight presentation. The `fieldId` field is used to identify the field and merge fields from different presentations.'

    PresentationRelatedResource:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        resourceId:
          type: string
          description: 'Stable identity key for merging across presentations, analogous to fieldId and filterId.'
        title:
          type: string
          description: 'Section heading displayed in the UI for this related resource.'
        order:
          type: number
          format: double
          description: 'Display order. Higher value means it shows first in UI.'
        topologyQuery:
          type: string
          description: |
            STQL query scoping the related components. Supports template interpolation with ${*} placeholders
            (e.g. ${identifiers[0]}, ${tags['namespace']}).
            The backend intersects this query with the referenced presentation's binding query.
        presentationIdentifier:
          type: string
          description: |
            References a ComponentPresentation by identifier to reuse its overview spec (columns, name, filters)
            for rendering this related resource section. Must be within the same stackpack.
      required:
        - resourceId
        - title
        - order
      description: |
        Related resource definition for the highlight page. Each entry defines a section showing components
        related to the one being viewed, rendered using the referenced presentation's overview spec.
        Merge semantics follow highlight field rules:
        - All presentations whose binding matches the component contribute related resources.
        - Same resourceId with higher specificity wins (override).
        - Different resourceId entries are appended.
        - Display order is determined by the order field.

    PresentationLink:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        linkId:
          type: string
          description: 'Stable identity key for merging across presentations, analogous to fieldId and resourceId.'
        title:
          type: string
          description: 'CEL expression that returns the displayed link title.'
        target:
          type: string
          description: 'CEL expression that returns a relative or fully-qualified link target.'
        openInNewTab:
          type: boolean
          default: false
          description: 'Whether the link opens in a new tab. Defaults to false.'
        tooltip:
          type: string
          description: 'Optional CEL expression that returns tooltip text.'
        filter:
          type: string
          description: 'Optional CEL boolean expression deciding whether the link is shown. Missing filters default to true.'
        order:
          type: number
          format: double
          description: 'Display order. Higher value means it shows first in UI.'
      required:
        - linkId
      description: |
        Link definition for the highlight page. Each entry defines a navigation link shown for a component.
        Merge semantics follow related resource rules:
        - All presentations whose binding matches the component contribute links.
        - Same linkId with higher specificity wins (override).
        - Different linkId entries are appended.
        - Display order is determined by the order field.
        CEL expressions are evaluated against the component presentation context. The filter is evaluated first;
        if it evaluates to false the link is omitted. If the filter includes the link but required data cannot be
        evaluated, the resolved highlight response reports an error link.

    ComponentHighlightProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      discriminator:
        propertyName: _type
      oneOf:
        - $ref: '#/components/schemas/HealthProjection'
        - $ref: '#/components/schemas/MetricProjection'
        - $ref: '#/components/schemas/ComponentLinkProjection'
        - $ref: '#/components/schemas/TextProjection'
        - $ref: '#/components/schemas/NumericProjection'
        - $ref: '#/components/schemas/DurationProjection'
        - $ref: '#/components/schemas/RatioProjection'
        - $ref: '#/components/schemas/ContainerImageProjection'
        - $ref: '#/components/schemas/MapProjection'
        - $ref: '#/components/schemas/TagProjection'
      description: 'Display type and value for the field.'

    ComponentOverviewProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      discriminator:
        propertyName: _type
      oneOf:
        - $ref: '#/components/schemas/HealthProjection'
        - $ref: '#/components/schemas/MetricProjection'
        - $ref: '#/components/schemas/ComponentLinkProjection'
        - $ref: '#/components/schemas/TextProjection'
        - $ref: '#/components/schemas/NumericProjection'
        - $ref: '#/components/schemas/DurationProjection'
        - $ref: '#/components/schemas/RatioProjection'
        - $ref: '#/components/schemas/ContainerImageProjection'
      description: 'Display type and value for the field.'

    HealthProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [HealthProjection]
        value:
          type: string
          description: 'Cel expression that returns a string that represents a valid HealthState'
      required:
        - _type
        - value
    MapProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [MapProjection]
        value:
          type: string
          description: 'Cel expression that returns a map<string,dyn>'
      required:
        - _type
        - value
    TagProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [TagProjection]
      required:
        - _type
    MetricProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [MetricProjection]
        query:
          type: string
          description: "Individual metric query that returns a timeseries for a specific cell."
        unit:
          type: string
        decimalPlaces:
          type: integer
        sparkline:
          type: boolean
        metricId:
          type: string
      required:
        - _type
        - query
    ComponentLinkProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [ComponentLinkProjection]
        name:
          type: string
          description: 'Cel expression that returns a string that represents the name of the component to link to'
        identifier:
          type: string
          description: 'Cel expression that returns a string that represents the identifier in order to build the link'
      required:
        - _type
        - name
        - identifier
    TextProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [TextProjection]
        value:
          type: string
          description: 'Cel expression that returns a string'
        asTag:
          type: boolean
          default: false
          description: 'Should the value be rendered as a tag or as plain text'
      required:
        - _type
        - value
    NumericProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [NumericProjection]
        value:
          type: string
          description: 'Cel expression that returns a number'
        unit:
          type: string
          nullable: true
        decimalPlaces:
          type: integer
      required:
        - _type
        - value
    DurationProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      properties:
        _type:
          type: string
          enum: [DurationProjection]
        startTime:
          type: string
          description: 'Cel expression that returns an ISO8601 formatted timestamp'
        endTime:
          type: string
          description: 'Cel expression that returns an ISO8601 formatted timestamp'
      required:
        - _type
        - startTime

    RatioProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      description: 'Helps rendering columns that summarize success rates'
      properties:
        _type:
          type: string
          enum: [RatioProjection]
        numerator:
          type: string
          description: 'Cel expression that returns a number'
        denominator:
          type: string
          description: 'Cel expression that returns a number'
        status:
          type: string
          description: 'Cel expression that returns a string that represents a valid HealthState'
      required:
        - _type
        - numerator
        - denominator

    ContainerImageProjection:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      description: 'Helps rendering links for docker images'
      properties:
        _type:
          type: string
          enum: [ContainerImageProjection]
        imageId:
          type: string
          description: 'Cel expression that returns a string'
        imageName:
          type: string
          description: 'Cel expression that returns a string'
      required:
        - _type
        - imageId
        - imageName

    ComponentTypeHighlights:
