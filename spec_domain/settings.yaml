    PresentationTracesPerspective:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      description: |
        Makes the Traces perspective available on components matched by this presentation.
        Absence of the field means the Traces perspective is not shown.
        Most-specific-wins merge semantics across matching ComponentPresentations: the whole
        section is taken from the most specific presentation that defines it, it is not merged
        field by field.
      properties:
        showTraces:
          type: boolean
          description: 'Set to false on a more specific presentation to suppress a Traces perspective enabled by a less specific one.'
        spanFilter:
          $ref: "#/components/schemas/PresentationSpanFilter"
      required:
        - showTraces
        - spanFilter

    PresentationSpanFilter:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
      type: object
      description: |
        Selects the spans shown in the Traces perspective for a component.
        String-valued fields are string templates: text is taken literally and any `${...}`
        placeholder is evaluated as a CEL expression against the component, using the same context
        as metric perspective queries. For example `orderService` is a literal, while
        `${tags.singleValue('service.namespace')}` resolves the tag of that name. Note that `tags`
        maps each key to a list of values, so use `singleValue` inside a placeholder when a single
        string is required.
        Enum- and duration-valued fields are literals and are not evaluated.
        Resolution is best effort: a field whose expression fails to parse or evaluate is dropped
        from the filter and logged, the remaining fields still apply.
      properties:
        serviceName:
          type: array
          items:
            type: string
          description: "Filter spans by service name"
        spanName:
          type: array
          items:
            type: string
          description: "Filter spans by name"
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: "Filter spans by 1 or more attributes"
        spanKind:
          type: array
          items:
            $ref: "#/components/schemas/SpanKind"
          description: "Filter spans by kind"
        spanParentType:
          type: array
          items:
            $ref: "#/components/schemas/SpanParentType"
          description: "Filter spans by parent type"
        statusCode:
          type: array
          items:
            $ref: "#/components/schemas/SpanStatusCode"
          description: "Filter spans by status code"
        durationFromNanos:
          type: integer
          format: int64
          description: "Filter spans by duration >= value, in nanoseconds"
        durationToNanos:
          type: integer
          format: int64
          description: "Filter spans by duration < value, in nanoseconds"
        scopeName:
          type: array
          items:
            type: string
          description: "Filter spans by instrumentation scope name"
        scopeVersion:
          type: array
          items:
            type: string
          description: "Filter spans by instrumentation scope version"

    SpanKind:
      x-stability: stable
      x-docs-url: https://documentation.suse.com/cloudnative/suse-observability/latest/en/setup/custom-integrations/presentation/schemas-ref.html
